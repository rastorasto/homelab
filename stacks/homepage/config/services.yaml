---
# Service layout: https://gethomepage.dev/configs/services/

- Media:
      - Jellyfin:
            icon: jellyfin
            href: https://jellyfin.mnau.org/
            widget:
                type: jellyfin
                url: http://jellyfin:8096
                key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
                version: 2
                enableBlocks: true
                enableNowPlaying: true
                enableUser: true
                enableMediaControl: false
                showEpisodeNumber: true
                expandOneStreamToTwoRows: false

      - Audiobookshelf:
            icon: audiobookshelf.svg
            href: https://audiobookshelf.mnau.org/
            widget:
                type: audiobookshelf
                url: http://audiobookshelf:80
                key: "{{HOMEPAGE_VAR_AUDIOBOOKSHELF_API_KEY}}"
                fields: ["books", "booksDuration"]

      - LiteLLM:
            icon: /icons/litellm.webp
            href: https://ai.mnau.org/
            container: litellm

      - LLM endpoint status:
            href: https://llm.ai.e-infra.cz/status/
            description: Metacentrum

      - Dockhand:
            icon: dockhand
            href: https://dockhand.mnau.org/
            widget:
                type: dockhand
                url: https://dockhand.mnau.org
                key: "{{HOMEPAGE_VAR_DOCKHAND_KEY}}"

- Downloads:
      - qBittorrent:
            icon: qbittorrent.svg
            href: https://qbittorrent.mnau.org/
            widget:
                type: qbittorrent
                url: http://qbittorrent:49666
                username: admin
                password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"

      - MyAnonaMouse:
            icon: /icons/myanonamouse.png
            href: https://www.myanonamouse.net/

- Tools:
      - FreshRSS:
            icon: freshrss.svg
            href: https://freshrss.mnau.org/
            widget:
                type: freshrss
                url: http://freshrss:80
                username: admin
                password: "{{HOMEPAGE_VAR_FRESHRSS_PASSWORD}}"

      - The Lounge:
            icon: thelounge.svg
            href: https://thelounge.mnau.org/
            container: thelounge

      - Paperless:
            icon: paperless.svg
            href: https://paperless.mnau.org/
            widget:
                type: paperlessngx
                url: http://paperless:8000
                username: void
                password: "{{HOMEPAGE_VAR_PAPERLESS_PASSWORD}}"

      - SearXNG:
            icon: searxng.svg
            href: https://search.mnau.org/
            container: searxng

      - BentoPDF:
            icon: bentopdf.svg
            href: https://pdf.mnau.org/
            container: bentopdf

      - Vaultwarden:
            icon: vaultwarden.svg
            href: https://vaultwarden.mnau.org/
            container: vaultwarden

      - Forgejo:
            icon: forgejo.svg
            href: https://forgejo.mnau.org/
            container: forgejo

      - Running:
            icon: si-streamlit
            href: https://running.mnau.org/
            container: running

      - Pangolin:
            icon: pangolin.svg
            href: https://pangolin.mnau.org/

- Infrastructure:
      - Meow (PVE):
            icon: proxmox.png
            href: https://meow.mnau.org/
            widget:
                type: proxmox
                url: https://192.168.0.111:8006
                username: api@pam!homepage
                password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
                node: Meow
                fields: ["vms", "lxc", "resources.cpu", "resources.mem"]

      - Grafana:
            icon: grafana.svg
            href: https://grafana.mnau.org/
            container: grafana

      - Prometheus:
            icon: prometheus.svg
            href: https://prometheus.mnau.org/
            container: prometheus

      - Samba:
            icon: /icons/samba-server.svg
            container: samba

      - Discord Bot:
            icon: discord.svg
            container: discord-bot

      - Blog:
            icon: sh-hugo
            href: https://blog.mnau.org/
            container: hugo
