services:
    homepage:
        image: ghcr.io/gethomepage/homepage:latest
        container_name: homepage
        restart: unless-stopped
        labels:
            caddy: homepage.${DOMAIN_NAME:-mnau.org}
            caddy.reverse_proxy: "{{upstreams 3000}}"
        volumes:
            - ./config:/app/config
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - proxy
        env_file:
            - .env
        environment:
            HOMEPAGE_ALLOWED_HOSTS: "homepage.mnau.org"

networks:
  proxy:
    external: true
