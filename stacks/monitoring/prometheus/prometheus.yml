global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-ubuntu
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          node: ubuntu-vm

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Remote nodes: install node_exporter there (see agents/install-node-exporter.sh).
  # Targets stay "down" until then - expected.
  - job_name: node-pve
    scrape_interval: 60s
    static_configs:
      - targets: ["100.126.189.42:9100"]   # meow PVE (tailscale)
        labels:
          node: meow-pve

  - job_name: node-vps
    scrape_interval: 60s
    static_configs:
      - targets: ["79.76.103.175:9100"]    # oracle vps (public)
        labels:
          node: oracle-vps

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://blog.mnau.org
          - https://counter.mnau.org/@mnaublog
          - https://pangolin.mnau.org
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
