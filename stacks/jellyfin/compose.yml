services:
    jellyfin:
        image: jellyfin/jellyfin
        container_name: jellyfin
        user: 1000:1000
        restart: unless-stopped
        labels:
            caddy: jellyfin.${DOMAIN_NAME:-mnau.org}
            caddy.reverse_proxy: "{{upstreams 8096}}"
        networks:
            - proxy
        volumes:
            - ${DOCKER_DATA:-/home/meow/docker-data}/jellyfin:/config
            - ${DOCKER_DATA:-/home/meow/docker-data}/jellyfin/cache:/cache
            - /mnt/data/torrents/media:/media:ro

networks:
    proxy:
      external: true
