services:
  omniroute:
    image: diegosouzapw/omniroute:3.8.50
    container_name: omniroute
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    labels:
      caddy: omni.${DOMAIN_NAME:-mnau.org}
      caddy.reverse_proxy: "{{upstreams 20128}}"
      dockhand.update: "false"   # pinned app with fast upstream churn; bump manually
    env_file:
      - .env
    volumes:
      - ${DOCKER_DATA:-/home/meow/docker-data}/omniroute:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
