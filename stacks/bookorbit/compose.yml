services:
  app:
    image: ${APP_IMAGE:-ghcr.io/bookorbit/bookorbit:latest}
    container_name: bookorbit-app
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      caddy: books.${DOMAIN_NAME:-mnau.org}
      caddy.reverse_proxy: "{{upstreams 3000}}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CLIENT_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /mnt/data/media/books:/books
      - ${DOCKER_DATA:-/home/meow/docker-data}/bookorbit/app:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - proxy
      - internal

  postgres:
    image: pgvector/pgvector:pg18
    container_name: bookorbit-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${DOCKER_DATA:-/home/meow/docker-data}/bookorbit/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:
    driver: bridge
