services:
    thelounge:
        image: ghcr.io/thelounge/thelounge:latest
        container_name: thelounge
        restart: unless-stopped
        labels:
            caddy: thelounge.${DOMAIN_NAME:-mnau.org}
            caddy.reverse_proxy: "{{upstreams 9000}}"
        networks:
            - proxy
        volumes:
            - ${DOCKER_DATA:-/home/meow/docker-data}/thelounge/data:/var/opt/thelounge
        environment:
            - THELOUNGE_HOME=/var/opt/thelounge

networks:
  proxy:
    external: true
