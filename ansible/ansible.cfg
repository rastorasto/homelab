[defaults]
# provisioning happens ON the target box (see inventory.ini: connection=local)
inventory      = inventory.ini
interpreter_python = auto_silent
retry_files_enabled = false

# secrets live in ansible/group_vars/vault.yml (encrypted).
# run: ansible-playbook site.yml --ask-vault-pass
# (or drop the password in a 600-perms file and export ANSIBLE_VAULT_PASSWORD_FILE=path)
