---
# One play. Order matters: base -> docker -> tailscale -> storage -> deploy.
# Everything idempotent; re-run any time, it only fixes what drifted.

- name: Platform provisioning
  hosts: home
  become: true
  tasks:
    - name: Fail early if the data disk UUID wasn't configured
      ansible.builtin.fail:
        msg: "set data_disk_uuid in ansible/group_vars/all.yml (see: lsblk -o NAME,UUID)"
      when: data_disk_uuid is not defined or not data_disk_uuid

    - ansible.builtin.include_tasks: tasks/base.yml
    - ansible.builtin.include_tasks: tasks/docker.yml
    - ansible.builtin.include_tasks: tasks/tailscale.yml
    - ansible.builtin.include_tasks: tasks/storage.yml
    - ansible.builtin.include_tasks: tasks/deploy.yml
