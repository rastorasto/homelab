---
# The HDD: mount by UUID at /mnt/data + make docker WAIT for it
# (the stale-bind-mount gotcha from the running incident).

- name: Mount point for the data disk
  ansible.builtin.file:
    path: "{{ data_mount_point }}"
    state: directory
    mode: "0755"

# Single source of truth for the fstab line: the mount module manages the
# entry AND mounts it (a separate lineinfile would fight it every run).
- name: Data disk in fstab and mounted
  ansible.builtin.mount:
    path: "{{ data_mount_point }}"
    src: "UUID={{ data_disk_uuid }}"
    fstype: ext4
    opts: defaults,nofail,noatime
    dump: "0"
    passno: "2"
    state: mounted

# Drop-in so docker never starts against an unmounted /mnt/data.
# First apply restarts docker once (needs daemon-reload FIRST - handler order).
- name: Docker blocks until /mnt/data is mounted
  ansible.builtin.template:
    src: ../templates/docker-require-mount.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-mnt-data.conf
    mode: "0644"
  notify:
    - reload systemd (docker)
    - restart docker
