---
# Tailscale. Provisioning ends at "tailscaled installed"; the first
# `tailscale up` is deliberately manual (auth that can't live in ansible
# without a vault - see README). Repo layout mirrors the official installer:
# key at /usr/share/keyrings/tailscale-archive-keyring.gpg, which the
# .tailscale-keyring.list already references via signed-by - don't rewrite it.

- name: Tailscale apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ tailscale_distro_codename }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Tailscale apt repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ tailscale_distro_codename }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"

- name: Tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: tailscaled running
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true
  # `tailscale up` is the one deliberate manual step after provisioning
  # (prints a login link you click once - see ansible/README.md).
